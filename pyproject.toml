[project]
name = "restaurant-ai-agent"
version = "0.1.0"
description = "AI agent for restaurant automation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.90.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
