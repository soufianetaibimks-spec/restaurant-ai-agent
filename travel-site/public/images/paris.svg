<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="رسم توضيحي لبرج إيفل بباريس عند الغسق">
  <defs>
    <linearGradient id="pr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a67"/>
      <stop offset="55%" stop-color="#5a6fa8"/>
      <stop offset="100%" stop-color="#e0a06a"/>
    </linearGradient>
    <linearGradient id="pr-river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a7a"/>
      <stop offset="100%" stop-color="#1f2a4a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#pr-sky)"/>

  <!-- stars -->
  <g fill="#fdfaf6" opacity="0.7">
    <circle cx="140" cy="80" r="2"/>
    <circle cx="260" cy="130" r="2"/>
    <circle cx="980" cy="70" r="2"/>
    <circle cx="1080" cy="120" r="2"/>
  </g>

  <!-- riverbank buildings -->
  <g fill="#1e2748" opacity="0.9">
    <rect x="40" y="480" width="90" height="120"/>
    <rect x="140" y="450" width="70" height="150"/>
    <rect x="990" y="460" width="80" height="140"/>
    <rect x="1080" y="490" width="90" height="110"/>
  </g>
  <g fill="#e0a06a" opacity="0.6">
    <rect x="55" y="500" width="16" height="20"/>
    <rect x="90" y="500" width="16" height="20"/>
    <rect x="155" y="475" width="16" height="20"/>
    <rect x="185" y="475" width="16" height="20"/>
    <rect x="1005" y="480" width="16" height="20"/>
    <rect x="1035" y="480" width="16" height="20"/>
  </g>

  <!-- eiffel tower -->
  <g fill="#12182e">
    <polygon points="600,150 636,470 564,470"/>
    <polygon points="600,150 660,470 636,470 600,220"/>
    <polygon points="600,150 540,470 564,470 600,220"/>
    <rect x="520" y="470" width="160" height="24"/>
    <polygon points="540,470 600,330 660,470 636,470 600,380 564,470"/>
    <polygon points="560,600 640,600 660,494 540,494"/>
    <rect x="595" y="120" width="10" height="34"/>
  </g>
  <rect x="0" y="600" width="1200" height="14" fill="#0e1326"/>

  <!-- river -->
  <rect x="0" y="614" width="1200" height="136" fill="url(#pr-river)"/>
  <g fill="#e0a06a" opacity="0.25">
    <rect x="565" y="620" width="14" height="30"/>
    <rect x="590" y="618" width="10" height="26"/>
    <rect x="610" y="622" width="12" height="28"/>
    <rect x="630" y="619" width="10" height="26"/>
  </g>
</svg>
