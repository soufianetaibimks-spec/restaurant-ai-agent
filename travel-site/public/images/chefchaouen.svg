<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="رسم توضيحي لزقاق أزرق بمدينة شفشاون">
  <defs>
    <linearGradient id="cc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcdff5"/>
      <stop offset="100%" stop-color="#8fc6e6"/>
    </linearGradient>
    <linearGradient id="cc-wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f5f8b"/>
      <stop offset="100%" stop-color="#2d7fb0"/>
    </linearGradient>
    <linearGradient id="cc-wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d90c2"/>
      <stop offset="100%" stop-color="#2a6f9c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#cc-sky)"/>

  <!-- left wall -->
  <rect x="0" y="0" width="430" height="750" fill="url(#cc-wallL)"/>
  <!-- right wall -->
  <rect x="770" y="0" width="430" height="750" fill="url(#cc-wallR)"/>

  <!-- doorway arch -->
  <path d="M430 750 V330 Q430 220 600 220 Q770 220 770 330 V750 Z" fill="#7fb8da"/>
  <path d="M470 750 V340 Q470 255 600 255 Q730 255 730 340 V750 Z" fill="#0e3550"/>

  <!-- door -->
  <rect x="520" y="470" width="160" height="280" rx="4" fill="#1a4d70"/>
  <rect x="520" y="470" width="160" height="280" rx="4" fill="none" stroke="#e8dcc2" stroke-width="4"/>
  <circle cx="655" cy="610" r="6" fill="#e8dcc2"/>

  <!-- windows on walls -->
  <g fill="#e8dcc2" opacity="0.9">
    <rect x="80" y="150" width="90" height="120" rx="6"/>
    <rect x="220" y="380" width="90" height="120" rx="6"/>
    <rect x="940" y="150" width="90" height="120" rx="6"/>
    <rect x="1030" y="400" width="90" height="120" rx="6"/>
  </g>
  <g fill="#124a6b" opacity="0.7">
    <rect x="95" y="165" width="60" height="90" rx="3"/>
    <rect x="235" y="395" width="60" height="90" rx="3"/>
    <rect x="955" y="165" width="60" height="90" rx="3"/>
    <rect x="1045" y="415" width="60" height="90" rx="3"/>
  </g>

  <!-- steps -->
  <g fill="#dce8ef">
    <rect x="380" y="700" width="440" height="14"/>
    <rect x="400" y="686" width="400" height="14"/>
    <rect x="420" y="672" width="360" height="14"/>
  </g>

  <!-- potted plant -->
  <g>
    <rect x="330" y="640" width="46" height="50" rx="4" fill="#c1622d"/>
    <circle cx="353" cy="610" r="34" fill="#1f7a6c"/>
  </g>
</svg>
